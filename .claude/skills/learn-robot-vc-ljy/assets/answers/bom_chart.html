<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BOM 차트</title><style>:root{--bg:#fbfaf7;--ink:#1f2530;--sub:#5d6470;--line:#dfdcd3;--bar:#2e5bab;--head:#1b2c5e}
@media (prefers-color-scheme:dark){:root{--bg:#16191f;--ink:#eceef2;--sub:#a4abb8;--line:#333945;--bar:#6f9be8;--head:#2b3f7a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:800px;margin:0 auto;padding:32px 16px}h1{margin:4px 0 8px;font-size:clamp(26px,6vw,36px);line-height:1.3}h2{margin:36px 0 10px;font-size:21px}
.eyebrow,.note,.source{color:var(--sub);font-size:14px}.lead{margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:15px}th{background:var(--head);color:#fff;text-align:left}
th,td{padding:9px 10px;border:1px solid var(--line)}.row{margin:0 0 12px}.name{margin:0 0 3px;font-size:14px}.track{display:flex;align-items:center;gap:8px;min-height:30px}
.bar{display:block;height:24px;background:var(--bar);border-radius:0 4px 4px 0;flex:none}.val{white-space:nowrap;font-size:14px;font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;padding:0;list-style:none}.links a{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:6px;color:inherit}</style></head><body><main><h1>휴머노이드 BOM</h1><div class="row"><p class="name">Optimus Gen 2, 중국 공급망 제외 가정</p><div class="track"><span class="bar" style="width:50.0%"></span><span class="val">131,000달러 [S15]</span></div></div><div class="row"><p class="name">Optimus Gen 2, 중국 공급망 포함</p><div class="track"><span class="bar" style="width:17.6%"></span><span class="val">46,000달러 [S15]</span></div></div><div class="row"><p class="name">중국산 휴머노이드, 2025년</p><div class="track"><span class="bar" style="width:13.4%"></span><span class="val">35,000달러 [S13]</span></div></div><div class="row"><p class="name">중국산 휴머노이드, 2030년 전망</p><div class="track"><span class="bar" style="width:6.5%"></span><span class="val">17,000달러 미만 [S13]</span></div></div><p class="note">로봇과 추정 기관이 달라 막대끼리 직접 비교하지 않는다.</p></main></body></html>
